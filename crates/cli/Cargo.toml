[package]
name = "stillwind-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "stillwind"
path = "src/main.rs"

[dependencies]
stillwind-compiler = { path = "../compiler" }
stillwind-design-system = { path = "../design-system" }
stillwind-diagnostics = { path = "../diagnostics" }
stillwind-ir = { path = "../ir" }
stillwind-js-oxc = { path = "../js-oxc" }
stillwind-source = { path = "../source" }
oxc_resolver.workspace = true
pathdiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stillwind-compiler = { path = "../compiler", features = ["parallel"] }
