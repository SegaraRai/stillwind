[package]
name = "stillwind-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lean_string.workspace = true
stillwind-compiler = { path = "../compiler" }
stillwind-css = { path = "../css", features = ["minify"] }
stillwind-design-system = { path = "../design-system" }
stillwind-diagnostics = { path = "../diagnostics" }
stillwind-ir = { path = "../ir" }
stillwind-js-oxc = { path = "../js-oxc" }
stillwind-project = { path = "../project" }
stillwind-semantic = { path = "../semantic" }
stillwind-source = { path = "../source" }
napi-derive.workspace = true
napi.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
stillwind-test-support = { path = "../test-support" }
serde_json.workspace = true

[build-dependencies]
napi-build.workspace = true

[[test]]
name = "binding"
path = "tests/binding/mod.rs"
