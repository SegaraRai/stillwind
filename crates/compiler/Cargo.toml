[package]
name = "stillwind-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Prepares canonical indexes on the rayon thread pool. WASM builds leave it disabled.
parallel = ["dep:rayon"]

[dependencies]
lean_string.workspace = true
stillwind-css = { path = "../css", features = ["minify"] }
stillwind-design-system = { path = "../design-system" }
stillwind-diagnostics = { path = "../diagnostics" }
stillwind-ir = { path = "../ir" }
stillwind-semantic = { path = "../semantic" }
stillwind-source = { path = "../source" }
stillwind-syntax = { path = "../syntax" }
blake3.workspace = true
cssparser.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
stillwind-js-oxc = { path = "../js-oxc" }
stillwind-test-support = { path = "../test-support" }
lightningcss.workspace = true
proptest.workspace = true

[build-dependencies]
blake3.workspace = true

[[test]]
name = "compilation_contracts"
path = "tests/compilation_contracts/mod.rs"

[[test]]
name = "module_compiler"
path = "tests/module_compiler/mod.rs"

[[test]]
name = "static_compile"
path = "tests/static_compile/mod.rs"
