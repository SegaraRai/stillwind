packages:
  - apps/*
  - examples/*
  - experiments/*
  - "!experiments/module-graph"
  - packages/*
  - packages/native/npm/*
  - tools

allowBuilds:
  "@swc/core": false # Platform binaries are provided by optional dependencies.
  esbuild: true

catalogs:
  default:
    "@types/node": ^26.4.0
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
    vite-plus: 1.0.0-rc.1

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0-rc.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0-rc.1"
  - vite-plus@1.0.0-rc.1

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
