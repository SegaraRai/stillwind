packages:
  - apps/*
  - benchmarks
  - e2e/css
  - e2e/harness
  - e2e/play
  - e2e/bundlers/*
  - e2e/frameworks/*
  - e2e/plugins/*
  - e2e/webcomponents/*
  - packages/*
  - packages/native/npm/*
  - plugins/*
  - tools/*

allowBuilds:
  "@parcel/watcher": true
  "@vscode/vsce-sign": false # VSIX creation does not require package signing.
  "@swc/core": false # Platform binaries are provided by optional dependencies.
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: true
  gatsby: false # Use the API definitions bundled with Gatsby.
  gatsby-cli: false
  lmdb: false # Platform binaries are provided by optional dependencies.
  msgpackr-extract: false # Platform binaries are provided by optional dependencies.
  sharp: true
  svelte-preprocess: false
  workerd: false # The runtime resolves its binary from the platform package.

catalogs:
  default:
    "@jridgewell/gen-mapping": ^0.3.13
    "@jridgewell/remapping": ^2.3.5
    "@jridgewell/trace-mapping": ^0.3.31
    "@rolldown/browser": ^1.2.16
    "@types/node": ^26.6.6
    "@vitest/browser-playwright": 5.0.5
    "@vitest/ui": 5.0.5
    "@webref/css": 8.7.8
    cf: ^1.0.0-beta.26
    pathe: ^2.0.3
    playwright: ^1.64.1
    rolldown: ^1.2.16
    tailwindcss: 4.3.3
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
    vitest: 5.0.5

overrides:
  # The browser loader and wasm-runtime plugins require the same emnapi API.
  "@rolldown/browser>@emnapi/core": 2.0.0-beta.2
  "@rolldown/browser>@emnapi/runtime": 2.0.0-beta.2
  # Vue's language plugin and its TypeScript augmentation share one Volar version.
  "@vue/language-core@3.3.14>@volar/language-core": 2.4.30
  "@vitest/ui": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

patchedDependencies:
  "@napi-rs/cli@3.10.9": patches/@napi-rs__cli@3.10.9.patch
  "@rolldown/browser@1.2.16": patches/@rolldown__browser@1.2.16.patch

versioning:
  maxBump: minor
  changelog:
    storage: repository
  # `fixed` and `ignore` accept exact names only. tools/workspace/versioning.test.ts keeps them
  # in step with the workspace.
  fixed:
    - - "@stillwind/analysis"
      - "@stillwind/cli"
      - "@stillwind/config"
      - "@stillwind/host"
      - "@stillwind/integration"
      - "@stillwind/language-server"
      - "@stillwind/native"
      - "@stillwind/native-darwin-arm64"
      - "@stillwind/native-darwin-x64"
      - "@stillwind/native-linux-arm64-gnu"
      - "@stillwind/native-linux-x64-gnu"
      - "@stillwind/native-wasm32-wasi"
      - "@stillwind/native-win32-arm64-msvc"
      - "@stillwind/native-win32-x64-msvc"
      - "@stillwind/plugin-iconify"
      - "@stillwind/projection"
      - "@stillwind/vscode-extension"
      - "prettier-plugin-stillwind"
      - "stillwind"
  ignore:
    - "@stillwind-internal/apps-fixtures-viewer"
    - "@stillwind-internal/apps-logo-editor"
    - "@stillwind-internal/apps-play"
    - "@stillwind-internal/apps-website"
    - "@stillwind-internal/benchmarks"
    - "@stillwind-internal/e2e-astro7-plain"
    - "@stillwind-internal/e2e-astro7-preact10-solid1"
    - "@stillwind-internal/e2e-astro7-react19-svelte5-vue3"
    - "@stillwind-internal/e2e-css"
    - "@stillwind-internal/e2e-fresh2-vite7-preact10"
    - "@stillwind-internal/e2e-gatsby5-react19"
    - "@stillwind-internal/e2e-harness"
    - "@stillwind-internal/e2e-iconify-plugin"
    - "@stillwind-internal/e2e-next16-react19"
    - "@stillwind-internal/e2e-nuxt4-vue3"
    - "@stillwind-internal/e2e-play"
    - "@stillwind-internal/e2e-rsbuild2-plain"
    - "@stillwind-internal/e2e-rsbuild2-preact11"
    - "@stillwind-internal/e2e-rsbuild2-react19"
    - "@stillwind-internal/e2e-rsbuild2-solid1"
    - "@stillwind-internal/e2e-rsbuild2-svelte5"
    - "@stillwind-internal/e2e-rsbuild2-vue3"
    - "@stillwind-internal/e2e-rspack2-plain"
    - "@stillwind-internal/e2e-rspack2-preact11"
    - "@stillwind-internal/e2e-rspack2-react19"
