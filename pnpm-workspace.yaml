packages:
  - apps/*
  - benchmarks
  - e2e/css
  - e2e/harness
  - e2e/play
  - e2e/bundlers/*
  - e2e/frameworks/*
  - packages/*
  - packages/native/npm/*
  - tools/*

allowBuilds:
  "@parcel/watcher": true
  "@vscode/vsce-sign": false # VSIX creation does not require package signing.
  "@swc/core": false # Platform binaries are provided by optional dependencies.
  esbuild: true
  sharp: true
  svelte-preprocess: false

patchedDependencies:
  unplugin@3.4.0: patches/unplugin@3.4.0.patch

catalogs:
  default:
    "@types/node": ^26.6.5
    "@jridgewell/gen-mapping": ^0.3.13
    "@jridgewell/remapping": ^2.3.5
    "@jridgewell/trace-mapping": ^0.3.31
    "@vitest/browser-playwright": 5.0.3
    "@vitest/ui": 5.0.3
    "@webref/css": 8.7.6
    playwright: ^1.64.0
    tailwindcss: 4.3.3
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vite-plus: 1.1.0

overrides:
  "@vitest/ui": 5.0.3
  vite@*: "catalog:"
  vitest: 5.0.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
