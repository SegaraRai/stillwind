packages:
  - apps/*
  - examples/*
  - experiments/*
  - "!experiments/module-graph"
  - packages/*
  - packages/native/npm/*
  - tools

allowBuilds:
  "@swc/core": false # Platform binaries are provided by optional dependencies.
  esbuild: true

catalogs:
  default:
    "@types/node": ^26.4.0
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: ^0.3.0

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.11 # `vp toolchain vitest`

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
