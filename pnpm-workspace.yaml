packages:
  - apps/*
  - benchmarks
  - e2e/harness
  - e2e/css
  - e2e/frameworks/*
  - e2e/bundlers/*
  - examples/*
  - packages/*
  - packages/native/npm/*
  - tools

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": false # Platform binaries are provided by optional dependencies.
  esbuild: true
  sharp: true
  svelte-preprocess: false

patchedDependencies:
  unplugin@3.4.0: patches/unplugin@3.4.0.patch

catalogs:
  default:
    "@types/node": ^26.4.0
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
  - "@next/env@16.4.0-canary.25"
  - "@next/swc-darwin-arm64@16.4.0-canary.25"
  - "@next/swc-darwin-x64@16.4.0-canary.25"
  - "@next/swc-linux-arm64-gnu@16.4.0-canary.25"
  - "@next/swc-linux-arm64-musl@16.4.0-canary.25"
  - "@next/swc-linux-x64-gnu@16.4.0-canary.25"
  - "@next/swc-linux-x64-musl@16.4.0-canary.25"
  - "@next/swc-win32-arm64-msvc@16.4.0-canary.25"
  - "@next/swc-win32-x64-msvc@16.4.0-canary.25"
  - next@16.4.0-canary.25
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/react-start-client@1.168.39"
  - "@tanstack/react-start-rsc@0.1.59"
  - "@tanstack/react-start-server@1.167.46"
  - "@tanstack/react-start@1.168.60"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
  - "@tanstack/router-plugin@1.168.42"
  - "@tanstack/start-client-core@1.170.34"
  - "@tanstack/start-plugin-core@1.171.49"
  - "@tanstack/start-server-core@1.169.39"
  - "@tanstack/start-storage-context@1.167.36"
  - "@tanstack/solid-router@1.170.38"
  - "@tanstack/solid-start-client@1.168.37"
  - "@tanstack/solid-start-server@1.167.44"
  - "@tanstack/solid-start@1.168.57"

overrides:
  vite@*: "catalog:"
  vitest: 5.0.1

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
