[workspace]
members = [
  "crates/cli",
  "crates/compiler",
  "crates/css",
  "crates/design-system",
  "crates/diagnostics",
  "crates/ir",
  "crates/js-oxc",
  "crates/napi",
  "crates/project",
  "crates/semantic",
  "crates/source",
  "crates/syntax",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/SegaraRai/stillwind"
version = "0.0.0"

[workspace.dependencies]
blake3 = "1.8.7"
cssparser = "0.38.0"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = [
  "visitor",
  "into_owned",
] }
oxc = { version = "0.151.0", features = ["ast_visit", "semantic"] }
oxc_sourcemap = "8.1.2"
napi = { version = "3.14.0", default-features = false, features = ["napi8"] }
napi-build = "2.6.0"
napi-derive = "3.6.10"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "allow"
