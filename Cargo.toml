[workspace]
members = [
  "crates/source",
  "crates/ir",
  "crates/semantic",
  "crates/grammar",
  "crates/css",
  "crates/tailwind",
  "crates/js-oxc",
  "crates/core",
  "crates/cli",
  "crates/napi",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/izual/stillwind"
version = "0.0.0"

[workspace.dependencies]
blake3 = "1.8.7"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor"] }
oxc = { version = "0.147.0", features = ["ast_visit", "semantic"] }
napi = { version = "3.12.2", default-features = false, features = ["napi8"] }
napi-build = "2.4.1"
napi-derive = "3.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
