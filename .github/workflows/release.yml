name: Release

on:
  # `pnpm version -r` updates the ledger, so this push always carries a version commit.
  push:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  # The version pull request changes the ledger. Its run builds and tests the version commit
  # before the merge, and the publish jobs skip refs other than `main`.
  pull_request:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test every package, but do not upload them
        type: boolean
        default: true

permissions:
  contents: read

# A pull request run must not wait for a release on `main`. A new push to the version branch
# replaces the commit under test, but a release on `main` must finish its uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A cache restore can stall when the account exceeds its Actions cache egress limit. The
  # default of 10 minutes would delay every job that restores a Cargo cache.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    # Every other job depends on `binaries`, `shared`, `verify`, or `acceptance`, so this
    # condition on the four jobs limits pull request runs to the version branch of this
    # repository. A fork can also name a branch `version/main`.
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            runner: windows-2025
          - target: win32-arm64-msvc
            runner: windows-11-arm
          # The Intel runner builds much more slowly, so an Apple silicon runner cross-compiles
          # this binary. `desktop` still loads it on an Intel runner.
          - target: darwin-x64
            runner: macos-15
            rust-target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      # The binding needs no install scripts, and sharp 0.32 from the Gatsby fixture cannot
      # build on Windows Arm64.
      - run: vp i --frozen-lockfile --ignore-scripts
      - name: Set up Rust
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          rustup toolchain install 1.99.1 --profile minimal ${RUST_TARGET:+--target "$RUST_TARGET"}
          rustup default 1.99.1
      - name: Build and test the binding
        if: ${{ !matrix.rust-target }}
        run: vp run @stillwind/native#test
        env:
          NATIVE_USE_NAPI_CROSS: ${{ startsWith(matrix.target, 'linux-') }}
      # The runner cannot load a binary for another architecture.
      - name: Build the binding
        if: ${{ matrix.rust-target }}
        run: vp run @stillwind/native#build:binding
        env:
          NATIVE_TARGET: ${{ matrix.rust-target }}
      - name: Check the glibc requirement
        if: startsWith(matrix.target, 'linux-')
        env:
          TARGET: ${{ matrix.target }}
        run: node packages/native/check-glibc.ts "packages/native/.build/native/stillwind_native.$TARGET.node"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: packages/native/.build/native/stillwind_native.${{ matrix.target }}.node
          if-no-files-found: error
          retention-days: 7

  shared:
    name: Build shared outputs
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Build the Web package
        run: vp run --concurrency-limit 1 @stillwind/vscode-extension#package:web
      # The Desktop package test starts the built CLI.
      - name: Build the CLI
        run: vp run --concurrency-limit 1 @stillwind/cli#build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix-web
          path: packages/vscode-extension/dist/stillwind-web.vsix
          if-no-files-found: error
          retention-days: 7
      # JS bundles do not depend on the platform. Sharing them spares each Desktop runner the WASM
      # build, and WASI SDK has no Windows Arm64 release.
      - name: Archive the built packages
        run: tar --create --gzip --file shared-outputs.tar.gz --exclude='packages/vscode-extension/dist/web' --exclude='*.vsix' --exclude='*.node' packages/*/dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shared-outputs
          path: shared-outputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify ${{ matrix.task }}
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        task: [check, test:rust, test:js, test:fixtures:projects]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # Unoptimized compiler tests take over 20 minutes. Debug assertions stay enabled.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      # Incremental data and full debug info can fill the runner disk when `target/` is restored.
      # Line tables keep file and line numbers in panic backtraces.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Restore Cargo outputs
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-release-v2-${{ matrix.task }}-rust-1.99.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-v2-${{ matrix.task }}-rust-1.99.1-
      # The Fresh acceptance project runs `deno check`.
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.8
      - run: vp run --concurrency-limit 1 "$TASK"
        env:
          TASK: ${{ matrix.task }}
      # The repository's Actions cache is near its size limit, so pull requests only read it.
      - name: Save Cargo outputs
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # These tests reuse the builds of `test:js`. They run after the cache save, so the WASM
      # build does not enlarge the cache entry. The Tailwind comparison takes about 15 minutes,
      # which still ends before browser acceptance, so only a release runs it.
      - if: matrix.task == 'test:js'
        run: vp exec playwright install --with-deps chrome
        working-directory: e2e/harness
      - if: matrix.task == 'test:js'
        run: vp run --concurrency-limit 1 test:browser
      - if: matrix.task == 'test:js'
        run: vp run --concurrency-limit 1 test:wasm
      - if: matrix.task == 'test:js'
        run: vp run --concurrency-limit 1 test:tailwind

  desktop:
    name: Package ${{ matrix.target }}
    needs: [binaries, shared]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            native: win32-x64-msvc
            runner: windows-2025
          - target: win32-arm64
            native: win32-arm64-msvc
            runner: windows-11-arm
          - target: darwin-x64
            native: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            native: darwin-arm64
            runner: macos-15
          # This image tests the packaged binding on an older glibc than the other jobs use.
          - target: linux-x64
            native: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64
            native: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      # The packaging commands below run without `vp run`, so they need only these packages. A
      # full install takes several minutes on Windows Arm64 and Intel macOS.
      - run: vp i --frozen-lockfile --ignore-scripts --filter @stillwind-internal/root --filter "@stillwind/cli..." --filter "@stillwind/vscode-extension..."
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-${{ matrix.native }}
          path: packages/native/dist/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: shared-outputs
      - name: Package and test the server
        shell: bash
        # Direct commands skip the task dependencies, which would rebuild the bindings.
        run: |
          tar --extract --gzip --file shared-outputs.tar.gz
          node packages/native/collect-local-artifacts.ts
          node packages/vscode-extension/build.ts --package-desktop
          cd packages/vscode-extension
          vp test --run --mode package
          mv dist/stillwind-desktop.vsix "dist/stillwind-$TARGET.vsix"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: packages/vscode-extension/dist/stillwind-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Browser acceptance
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/e2e.yml
    with:
      support: primary

  # The version pull request and a dry run also test the weekly tier, so a release does not
  # wait for it. The upload jobs do not need this job, because it is skipped on a push.
  acceptance-compatibility:
    name: Browser acceptance (compatibility)
    if: (github.event_name == 'workflow_dispatch' && inputs.dry-run) || (github.event_name == 'pull_request' && github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/e2e.yml
    with:
      support: compatibility

  # This job runs beside `binaries` and the tests. `packages` adds the platform binaries and
  # checks the result, and `publish` uploads the packages after the tests pass.
  npm-packages:
    name: Build npm packages
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Build packages
        run: vp run --concurrency-limit 1 prepare-publish
      # The archive holds the generated files that `pnpm publish` packs. Tracked files come from
      # the checkout in `publish`. The archive omits the Linux x64 binary that this job builds for
      # the host, because `publish` uses the binaries from `binaries`.
      - name: Archive the built packages
        run: |
          git ls-files -z --others --ignored --exclude-standard -- packages plugins \
            | grep -zv -e '/node_modules/' -e '/\.build/' -e '\.tmp$' -e '\.node$' \
            | tar --create --gzip --null --files-from - --file npm-packages.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-packages
          path: npm-packages.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The version pull request runs this job, so a missing binary or a package that cannot be
  # packed fails before the merge.
  packages:
    name: Check npm packages
    needs: [binaries, npm-packages]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-packages
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/native/dist/
      # A direct command skips the task dependencies of `collect:local`, which would rebuild the
      # bindings.
      - name: Collect the platform binaries
        run: |
          tar --extract --gzip --file npm-packages.tar.gz
          node packages/native/collect-local-artifacts.ts
      - name: Require every platform binary
        # `collect-local-artifacts.ts` skips a missing binary, which would publish an empty
        # platform package.
        working-directory: packages/native/npm
        run: |
          for directory in *; do
            main=$(node --print "require('./$directory/package.json').main")
            test -f "$directory/$main"
          done
      # Recursive publication skips versions that already exist on npm.
      - name: Pack every package
        run: vp exec pnpm publish -r --dry-run --no-git-checks

  publish:
    name: Stage packages
    needs: [npm-packages, packages, verify, desktop, acceptance]
    # A push has no inputs, so `dry-run` is empty and the job stages the packages.
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-packages
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/native/dist/
      # A direct command skips the task dependencies of `collect:local`, which would rebuild the
      # bindings.
      - name: Collect the platform binaries
        run: |
          tar --extract --gzip --file npm-packages.tar.gz
          node packages/native/collect-local-artifacts.ts
      - name: Select the npm tag
        id: tag
        run: |
          version=$(node --print "require('./packages/core/package.json').version")
          case "$version" in
            *-*) echo 'name=next' >> "$GITHUB_OUTPUT" ;;
            *) echo 'name=latest' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Configure the bootstrap token
        # Trusted publishing needs no token. A package must exist before npm can trust this
        # workflow, so the first publication of a new package uses NPM_TOKEN.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$HOME/.npmrc"
          fi
      - name: Stage
        env:
          NPM_TAG: ${{ steps.tag.outputs.name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Branch rules and the job condition replace pnpm's Git checks. Recursive staging skips
        # versions that already exist on npm. A maintainer publishes the staged versions by
        # approving them with 2FA.
        run: vp exec pnpm stage publish -r --no-git-checks --tag "$NPM_TAG" --report-summary
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: publish-summary
          path: pnpm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 30

  publish-extension:
    name: Publish extension
    needs: [verify, desktop, acceptance]
    # A push has no inputs, so `dry-run` is empty and the job publishes.
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: extension-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      - run: vp i --frozen-lockfile --ignore-scripts --filter @stillwind/vscode-extension
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: packages/vscode-extension/vsix/
      # Marketplace versions are immutable, so a rerun after a partial failure skips the
      # packages that already exist.
      - name: Publish to Visual Studio Marketplace
        working-directory: packages/vscode-extension
        run: vp exec vsce publish --oidc --skip-duplicate --packagePath vsix/*.vsix
      - name: Publish to Open VSX
        working-directory: packages/vscode-extension
        run: vp exec ovsx publish --trusted-publishing --skip-duplicate --packagePath vsix/*.vsix

  github-release:
    name: Draft GitHub Release
    needs: [publish, publish-extension]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: ${{ runner.temp }}/release/
      - name: List checksums
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -- *.vsix > SHA256SUMS
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.vsix
      # The draft becomes public when a maintainer publishes it after approving the staged npm
      # packages, and GitHub creates the tag at that time. A rerun after a partial failure keeps
      # the notes of an existing draft and replaces only its assets.
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ runner.temp }}/release
        run: |
          version=$(node --print "require('./packages/core/package.json').version")
          flags=()
          list=(--exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          case "$version" in
            *-*) flags+=(--prerelease --latest=false) ;;
            # The notes of a stable release cover every change since the previous stable release.
            *) list+=(--exclude-pre-releases) ;;
          esac
          export RELEASE_TAGS
          RELEASE_TAGS=$(gh release list "${list[@]}")
          tag=$(node tools/workspace/release-draft.ts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --body-file "$RUNNER_TEMP/release-body.md")
          draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2> /dev/null || true)
          case "$draft" in
            false) echo "The GitHub Release $tag is already published." ;;
            true) gh release upload "$tag" "$RELEASE"/* --clobber ;;
            *) gh release create "$tag" "$RELEASE"/* --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/release-body.md" "${flags[@]}" ;;
          esac
