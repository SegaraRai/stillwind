name: Release extension

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test every VSIX, but do not publish them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-extension
  cancel-in-progress: false

env:
  # A cache restore can stall when the account exceeds its Actions cache egress limit.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  shared:
    name: Build shared outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Build the Web package
        run: vp run --concurrency-limit 1 @stillwind/vscode-extension#package:web
      # The Desktop package test starts the built CLI.
      - name: Build the CLI
        run: vp run --concurrency-limit 1 @stillwind/cli#build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-web
          path: packages/vscode-extension/dist/stillwind-web.vsix
          if-no-files-found: error
          retention-days: 7
      # JS bundles do not depend on the platform. Sharing them spares each Desktop runner the WASM
      # build, and WASI SDK has no Windows Arm64 release.
      - name: Archive the built packages
        run: tar --create --gzip --file shared-outputs.tar.gz --exclude='packages/vscode-extension/dist/web' --exclude='*.vsix' --exclude='*.node' packages/*/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-outputs
          path: shared-outputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Package ${{ matrix.target }}
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          # The oldest available image gives the binaries the lowest glibc requirement.
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      # The binding needs no install scripts, and sharp 0.32 from the Gatsby fixture cannot
      # build on Windows Arm64.
      - run: vp i --frozen-lockfile --ignore-scripts
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Build the binding
        run: vp run @stillwind/native#build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-outputs
      - name: Package and test the server
        shell: bash
        # Direct commands skip the task dependencies, which would rebuild the WASM binding.
        run: |
          tar --extract --gzip --file shared-outputs.tar.gz
          node packages/native/collect-local-artifacts.ts
          node packages/vscode-extension/build.ts --package-desktop
          cd packages/vscode-extension
          vp test --run --mode package
          mv dist/stillwind-desktop.vsix "dist/stillwind-$TARGET.vsix"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: packages/vscode-extension/dist/stillwind-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [shared, desktop]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: extension-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      - run: vp i --frozen-lockfile --ignore-scripts --filter @stillwind/vscode-extension
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: packages/vscode-extension/vsix/
      # Marketplace versions are immutable, so a rerun after a partial failure skips the
      # packages that already exist.
      - name: Publish to Visual Studio Marketplace
        working-directory: packages/vscode-extension
        run: vp exec vsce publish --oidc --skip-duplicate --packagePath vsix/*.vsix
      - name: Publish to Open VSX
        working-directory: packages/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: vp exec ovsx publish --skip-duplicate --packagePath vsix/*.vsix
