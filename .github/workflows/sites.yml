name: Sites

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUBLIC_WEBSITE_URL: ${{ github.ref == 'refs/heads/stable' && 'https://stillwind.dev/' || vars.SITES_PREVIEW_WEBSITE_URL }}
  PUBLIC_PLAYGROUND_URL: ${{ github.ref == 'refs/heads/stable' && 'https://play.stillwind.dev/' || vars.SITES_PREVIEW_PLAYGROUND_URL }}
  SITE_DEPLOYMENT: ${{ github.ref == 'refs/heads/stable' && 'production' || 'preview' }}
  CF_SEND_TELEMETRY: "false"

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      build: ${{ steps.plan.outputs.build }}
      website: ${{ steps.plan.outputs.website }}
      play: ${{ steps.plan.outputs.play }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_required: ${{ steps.plan.outputs.browser_required }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
          run-install: false
      - run: vp i --frozen-lockfile --filter @stillwind-internal/tools-sites...
      - name: Check workspace impact detection
        working-directory: tools/workspace
        run: |
          vp exec tsc --noEmit
          vp test --run
      - name: Check change intents and package versions
        run: vp exec pnpm change check
      - name: Check site planning and deployment tools
        working-directory: tools/sites
        run: |
          vp exec tsc --noEmit
          vp test --run
      - name: Select affected sites and browser scenarios
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            baseline=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/sites.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=100" \
              --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | .[0].head_sha // empty') || baseline=""
            export SITES_BASE_SHA="$baseline"
          fi
          vp exec pnpm -r list --depth -1 --json > "$RUNNER_TEMP/workspace-packages.json"
          node tools/sites/ci.ts "$RUNNER_TEMP/workspace-packages.json"

  build:
    name: Build sites
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: sites-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check deployment URLs
        run: |
          : "${PUBLIC_WEBSITE_URL:?Set SITES_PREVIEW_WEBSITE_URL}"
          : "${PUBLIC_PLAYGROUND_URL:?Set SITES_PREVIEW_PLAYGROUND_URL}"
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-sites-rust-1.99.1-wasi-33-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sites-rust-1.99.1-wasi-33-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-sites-rust-1.99.1-wasi-33-
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Prepare generated directories for task cache
        # Directory listings include generated names even when their contents are excluded.
        run: |
          mkdir -p packages/native/.build packages/native/dist .deploy
          mkdir -p node_modules/.vitest-cache node_modules/.vite-temp
          mkdir -p apps/website/.astro apps/website/.nimbus apps/website/dist apps/website/node_modules/.astro
          mkdir -p apps/play/.astro apps/play/.nimbus apps/play/dist/site apps/play/dist/acceptance apps/play/node_modules/.astro
      - name: Restore Vite task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-${{ runner.arch }}-sites-vite-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sites-vite-v1-
      - name: Build and check sites
        env:
          BUILD_WEBSITE: ${{ needs.changes.outputs.website }}
          BUILD_PLAY: ${{ needs.changes.outputs.play }}
        run: |
          touch "$RUNNER_TEMP/sites-cargo-start"
          if [ "$BUILD_WEBSITE" = true ] && [ "$BUILD_PLAY" = true ]; then
            vp run --concurrency-limit 1 verify:sites:build
          elif [ "$BUILD_WEBSITE" = true ]; then
            vp run --concurrency-limit 1 verify:sites:website
          else
            vp run --concurrency-limit 1 verify:sites:play
          fi
      - name: Report task cache results
        run: vp run --last-details
      - name: Upload browser assets
        if: needs.changes.outputs.browser_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-browser-${{ github.sha }}
          path: apps/play/dist/acceptance/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate production deploy
        if: github.ref == 'refs/heads/stable'
        env:
          BUILD_WEBSITE: ${{ needs.changes.outputs.website }}
          BUILD_PLAY: ${{ needs.changes.outputs.play }}
        run: |
          if [ "$BUILD_WEBSITE" = true ]; then
            vp run --ignore-depends-on @stillwind-internal/tools-sites#check:production:website
          fi
          if [ "$BUILD_PLAY" = true ]; then
            vp run --ignore-depends-on @stillwind-internal/tools-sites#check:production:play
          fi
      - name: Save Vite task cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-${{ github.sha }}
          path: |
            .deploy/website/.cloudflare/output/v0/
            .deploy/play/.cloudflare/output/v0/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check Cargo cache changes
        id: cargo-changes
        run: |
          if [ -d target ] && find target -type f -newer "$RUNNER_TEMP/sites-cargo-start" -print -quit | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save updated Cargo cache
        if: steps.cargo-changes.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  browser:
    name: Browser acceptance (${{ matrix.suite }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.browser_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.browser) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: sites-browser-${{ matrix.suite }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
          run-install: false
      - run: vp i --frozen-lockfile --filter @stillwind-internal/e2e-play
      - run: vp exec tsc --noEmit
        working-directory: e2e/play
      - run: vp exec playwright install --with-deps chrome
        working-directory: e2e/play
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-browser-${{ github.sha }}
          path: apps/play/dist/acceptance/
      - run: vp test --run "src/$BROWSER_SUITE.test.ts"
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        working-directory: e2e/play
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-browser-failure-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e/play/results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Build and verify
    needs: [changes, build, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      - name: Require successful selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/sites/ci.ts verify

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: [changes, verify]
    if: needs.changes.outputs.deploy_required == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/stable' && 'sites-production' || 'sites-preview' }}
      url: ${{ steps.publish.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.deploy) }}
    concurrency:
      group: sites-deploy-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'This run is obsolete because the branch has a newer commit. It cannot become the successful deployment baseline.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version: "26.13.0"
          cache: true
          run-install: false
      - name: Install deployment tools
        if: steps.head.outputs.current == 'true'
        run: vp i --frozen-lockfile --filter @stillwind-internal/tools-sites
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: sites-${{ github.sha }}
          path: .deploy/
      - name: Publish and check site
        id: publish
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE: ${{ matrix.site }}
        run: node tools/sites/deploy.ts "$SITE" "$GITHUB_REF_NAME"
