name: Sites

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_WEBSITE_URL: ${{ github.ref == 'refs/heads/stable' && 'https://stillwind.dev/' || vars.SITES_PREVIEW_WEBSITE_URL }}
  PUBLIC_PLAYGROUND_URL: ${{ github.ref == 'refs/heads/stable' && 'https://play.stillwind.dev/' || vars.SITES_PREVIEW_PLAYGROUND_URL }}
  SITE_DEPLOYMENT: ${{ github.ref == 'refs/heads/stable' && 'production' || 'preview' }}
  CF_SEND_TELEMETRY: "false"

jobs:
  build:
    name: Build sites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: sites-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check deployment URLs
        run: |
          : "${PUBLIC_WEBSITE_URL:?Set SITES_PREVIEW_WEBSITE_URL}"
          : "${PUBLIC_PLAYGROUND_URL:?Set SITES_PREVIEW_PLAYGROUND_URL}"
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-sites-rust-1.99.1-wasi-33-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sites-rust-1.99.1-wasi-33-
      - name: Set up WASI SDK
        # Rust 1.99 startup objects require the TLS initialization symbol removed in WASI SDK 34.
        # https://github.com/napi-rs/napi-rs/issues/3491
        env:
          WASI_ARCHIVE: wasi-sdk-33.0-x86_64-linux.tar.gz
          WASI_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - run: vp i --frozen-lockfile
      - run: vp run --concurrency-limit 1 verify:sites:build
      - name: Upload browser assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-browser-${{ github.sha }}
          path: apps/play/dist/acceptance/
          if-no-files-found: error
          retention-days: 7
      - name: Validate production deploy
        if: github.ref == 'refs/heads/stable'
        run: vp run @stillwind-internal/tools-sites#check:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-${{ github.sha }}
          path: |
            .deploy/website/.cloudflare/output/v0/
            .deploy/play/.cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: sites-browser-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
      - run: vp i --frozen-lockfile --filter @stillwind-internal/e2e-play
      - run: vp run @stillwind-internal/e2e-play#setup:browser
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites-browser-${{ github.sha }}
          path: apps/play/dist/acceptance/
      - run: vp test --run
        working-directory: e2e/play
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-browser-failure-${{ github.sha }}
          path: e2e/play/results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Build and verify
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful builds and browser acceptance
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/stable' && 'sites-production' || 'sites-preview' }}
      url: ${{ steps.publish.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        site: [website, play]
    concurrency:
      group: sites-deploy-${{ matrix.site }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped deployment because the branch has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version: "26.13.0"
          cache: true
      - name: Install deployment tools
        if: steps.head.outputs.current == 'true'
        run: vp i --frozen-lockfile --filter @stillwind-internal/tools-sites
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: sites-${{ github.sha }}
          path: .deploy/
      - name: Publish and check site
        id: publish
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE: ${{ matrix.site }}
        run: vp run @stillwind-internal/tools-sites#deploy -- "$SITE" "$GITHUB_REF_NAME"
