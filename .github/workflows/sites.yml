name: Sites

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://stillwind.dev
  SITE_DEPLOYMENT: ${{ github.ref == 'refs/heads/stable' && 'production' || 'preview' }}
  CF_SEND_TELEMETRY: "false"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: sites-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip1-threads
          rustup default 1.99.1
      - name: Set up WASI SDK
        env:
          WASI_ARCHIVE: wasi-sdk-34.0-x86_64-linux.tar.gz
          WASI_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          curl --fail --location --retry 3 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_ARCHIVE" -o "$RUNNER_TEMP/$WASI_ARCHIVE"
          echo "$WASI_SHA256  $RUNNER_TEMP/$WASI_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_ARCHIVE" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - run: vp i --frozen-lockfile
      - run: vp run @stillwind-internal/e2e-play#setup:browser
      - run: vp run verify:sites
      - name: Validate production deploy
        if: github.ref == 'refs/heads/stable'
        run: vp run @stillwind-internal/tools-sites#check:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites-${{ github.sha }}
          path: |
            .deploy/website/.cloudflare/output/v0/
            .deploy/play/.cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/stable' && 'sites-production' || 'sites-preview' }}
      url: ${{ steps.publish.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        site: [website, play]
    concurrency:
      group: sites-deploy-${{ matrix.site }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped deployment because the branch has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version: "26.13.0"
          cache: true
      - name: Install deployment tools
        if: steps.head.outputs.current == 'true'
        run: vp i --frozen-lockfile --filter @stillwind-internal/tools-sites
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: sites-${{ github.sha }}
          path: .deploy/
      - name: Publish and check site
        id: publish
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE: ${{ matrix.site }}
        run: vp run @stillwind-internal/tools-sites#deploy -- "$SITE" "$GITHUB_REF_NAME"
